<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Promotores</title>
    <style>
        :root { --didi-orange: #ff7d00; --bg-color: #f4f6f8; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Pantalla Login */
        #login-screen { text-align: center; margin-top: 50px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: var(--didi-orange); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* Dashboard */
        #dashboard-screen { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; background: white; font-weight: bold; color: var(--text); }
        
        /* Funnel (Leads, SU, DFT) */
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: white; padding: 15px 5px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; }
        .card h3 { margin: 0 0 8px 0; font-size: 13px; color: #666; font-weight: normal; }
        .card .number { font-size: 24px; font-weight: bold; margin: 0; color: #111; }
        .card.highlight { background: var(--text); color: white; }
        .card.highlight h3, .card.highlight .number { color: white; }
        
        /* Bloque de Comisiones */
        .bloque-comisiones { background: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .bloque-comisiones h2 { margin: 0 0 15px 0; font-size: 16px; color: var(--text); border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .monto-box h3 { margin: 0 0 5px 0; font-size: 13px; color: #666; font-weight: normal; }
        .monto-box .dinero { font-size: 22px; font-weight: bold; margin: 0; color: #111; }
        
        /* Textos de Bono */
        .bono-text { background: #f9f9f9; padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; color: #444; text-align: center; }
        .bono-text strong { color: var(--didi-orange); font-size: 18px; }
        
        /* Recomendación */
        .recomendacion-card { background: #fff3e0; border-left: 5px solid var(--didi-orange); padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 500; font-size: 15px; line-height: 1.5; }
        
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--didi-orange); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA LOGIN -->
    <div id="login-screen">
        <h2>Bienvenido</h2>
        <p>Ingresa tu correo para ver tus métricas</p>
        <input type="email" id="correo-input" placeholder="correo@ejemplo.com">
        <button onclick="iniciarSesion()">Entrar</button>
        <div id="loading" class="loader" style="margin-top: 15px;"></div>
        <p id="error-msg" style="color: red; font-size: 14px;"></p>
    </div>

    <!-- PANTALLA DASHBOARD -->
    <div id="dashboard-screen">
        <!-- Saludo y Selector -->
        <div class="header">
            <h2 style="margin:0; font-size: 18px;">Hola, <span id="nombre-usuario">Promotor</span></h2>
            <select id="selector-semana" onchange="actualizarVista()">
                <option value="1">Semana 1</option>
                <option value="2">Semana 2</option>
                <option value="3">Semana 3</option>
                <option value="4">Semana 4</option>
            </select>
        </div>

        <!-- Funnel (Leads, SU, DFT) -->
        <div class="grid-3">
            <div class="card">
                <h3>Leads</h3>
                <p class="number" id="val-leads">0</p>
            </div>
            <div class="card">
                <h3>SU</h3>
                <p class="number" id="val-su">0</p>
            </div>
            <div class="card highlight">
                <h3>DFT</h3>
                <p class="number" id="val-dft">0</p>
            </div>
        </div>

        <!-- Bloque de Comisiones -->
        <div class="bloque-comisiones">
            <h2>Tus comisiones Semanales:</h2>
            <div class="grid-2">
                <div class="monto-box">
                    <h3>Comisión</h3>
                    <p class="dinero">$<span id="val-comision">0</span></p>
                </div>
                <div class="monto-box">
                    <h3>Bono</h3>
                    <p class="dinero">$<span id="val-bono">0</span></p>
                </div>
            </div>
            
            <div class="bono-text">
                Para llegar al siguiente BONO SEMANAL te faltan <br><strong><span id="val-faltan">0</span></strong> conversiones.
                <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
                El siguiente bono es de... <strong>$<span id="val-sig-bono">0</span></strong>
            </div>
        </div>

        <!-- Recomendación -->
        <div class="recomendacion-card" id="recomendacion-box">
            <!-- La recomendación se inyecta aquí -->
        </div>

    </div>
</div>

<script>
    // ⚠️ PEGA AQUÍ TU NUEVA URL DE GOOGLE APPS SCRIPT
    const urlAPI = "https://script.google.com/macros/s/AKfycbzym_LHiVOKx9YjTDQLLgH0XwKm9dzFuufHyr7ild3C020txVQhc-jaZ6zfyiRKGCvhfQ/exec";
    
    let datosGlobales = {};

    function iniciarSesion() {
        const correo = document.getElementById('correo-input').value.trim();
        if(!correo) return;
        
        document.getElementById('loading').style.display = 'block';
        document.getElementById('error-msg').innerText = '';

        fetch(urlAPI + "?correo=" + encodeURIComponent(correo))
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if(data.error) {
                    document.getElementById('error-msg').innerText = data.error;
                } else {
                    datosGlobales = data;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard-screen').style.display = 'block';
                    
                    document.getElementById('nombre-usuario').innerText = datosGlobales['Nombre'] || 'Promotor';
                    
                    // Cargamos los datos de la semana 1 por defecto al entrar
                    actualizarVista(); 
                }
            })
            .catch(err => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-msg').innerText = "Error de conexión.";
            });
    }

    function actualizarVista() {
        const numSemana = document.getElementById('selector-semana').value;
        
        // Mapeamos los datos dependiendo del número de semana elegido (ej. LEADS_1, LEADS_2)
        document.getElementById('val-leads').innerText = datosGlobales['LEADS_' + numSemana] || '0';
        document.getElementById('val-su').innerText = datosGlobales['SU_' + numSemana] || '0';
        document.getElementById('val-dft').innerText = datosGlobales['DFT_' + numSemana] || '0';
        
        document.getElementById('val-comision').innerText = datosGlobales['COMISION_' + numSemana] || '0';
        document.getElementById('val-bono').innerText = datosGlobales['BONO_' + numSemana] || '0';
        
        document.getElementById('val-faltan').innerText = datosGlobales['FALTAN_' + numSemana] || '0';
        document.getElementById('val-sig-bono').innerText = datosGlobales['SIG_BONO_' + numSemana] || '0';
        
        // La recomendación puede ser por semana (RECOMENDACION_1) o general (RECOMENDACION)
        const recomendacion = datosGlobales['RECOMENDACION_' + numSemana] || datosGlobales['RECOMENDACION'] || '¡Sigue prospectando!';
        document.getElementById('recomendacion-box').innerHTML = "💡 " + recomendacion;
    }
</script>
</body>
</html>
