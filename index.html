<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Promotores</title>
    <style>
        :root { --didi-orange: #ff7d00; --bg-color: #f4f6f8; --text: #333; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 30px; }
        
        #login-screen { text-align: center; margin-top: 50px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: var(--didi-orange); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        #dashboard-screen { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; background: white; font-weight: bold; color: var(--text); }
        
        .meta-box { background: #333; color: white; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-weight: bold; letter-spacing: 0.5px; }
        .meta-box span { color: var(--didi-orange); }
        
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .card { background: white; padding: 15px 5px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; }
        .card h3 { margin: 0 0 8px 0; font-size: 13px; color: #666; font-weight: normal; }
        .card .number { font-size: 24px; font-weight: bold; margin: 0; color: #111; }
        .card.highlight { background: var(--didi-orange); color: white; }
        .card.highlight h3, .card.highlight .number { color: white; }
        
        .semaforo-box { padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: 500; border: 1px solid rgba(0,0,0,0.1); }
        
        .recomendacion-card { background: white; border-left: 5px solid #2196F3; padding: 15px; border-radius: 8px; margin-bottom: 25px; font-size: 14px; line-height: 1.5; font-weight: 500; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        
        .bloque-crema { background: #fffdf5; border: 1px solid #f0e6d2; padding: 20px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .bloque-crema h2 { margin: 0 0 15px 0; font-size: 16px; color: #5a4f3b; border-bottom: 1px solid #e8dec8; padding-bottom: 10px; text-align: center;}
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; text-align: center; }
        .monto-box h3 { margin: 0 0 5px 0; font-size: 13px; color: #8c7e63; font-weight: normal; }
        .monto-box .dinero { font-size: 22px; font-weight: bold; margin: 0; color: #4a3e2a; }
        .bono-text { background: rgba(255, 255, 255, 0.6); padding: 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; color: #5a4f3b; text-align: center; }
        .bono-text strong { color: var(--didi-orange); font-size: 16px; }

        .bloque-podio { background: white; padding: 20px; border-radius: 16px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .bloque-podio h2 { margin: 0 0 15px 0; font-size: 16px; text-align: center; }
        .podio-msg { padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 15px; text-align: center; font-weight: 500; background: #f9f9f9;}
        .podio-msg.exito { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .podio-msg.motivacion { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .podio-wrapper { display: flex; justify-content: center; align-items: flex-end; gap: 10px; margin-top: 15px; }
        .podio-col { display: flex; flex-direction: column; align-items: center; width: 30%; text-align: center; }
        .podio-nom { font-weight: bold; font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; color: #333; margin-bottom: 2px;}
        .podio-stats { font-size: 11px; color: #666; margin-bottom: 5px; font-weight: bold; background: #f4f6f8; padding: 2px 4px; border-radius: 4px;}
        .podio-bar { width: 100%; border-radius: 6px 6px 0 0; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 5px; color: white; font-weight: bold; font-size: 16px;}
        .oro .podio-bar { background: linear-gradient(to top, #e6b800, #ffcc00); height: 110px; }
        .plata .podio-bar { background: linear-gradient(to top, #9e9e9e, #cccccc); height: 80px; }
        .bronce .podio-bar { background: linear-gradient(to top, #cd7f32, #e69950); height: 50px; }
